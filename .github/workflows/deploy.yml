name: Build and Deploy Microservices to Azure Container Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  # ============================================================
  # JOB 1: Build & Push - Billing
  # ============================================================
  build-billing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push Billing image
        run: |
          docker build \
            -f Microservicios.Atracciones.Billing/Microservicios.Atracciones.Billing.API/Dockerfile \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/billing-api:${{ github.sha }} \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/billing-api:latest \
            .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/billing-api:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/billing-api:latest

  # ============================================================
  # JOB 2: Build & Push - Booking
  # ============================================================
  build-booking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push Booking image
        run: |
          docker build \
            -f Microservicios.Atracciones.Booking/Microservicios.Atracciones.Booking.API/Dockerfile \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/booking-api:${{ github.sha }} \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/booking-api:latest \
            .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/booking-api:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/booking-api:latest

  # ============================================================
  # JOB 3: Build & Push - Catalog
  # ============================================================
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push Catalog image
        run: |
          docker build \
            -f Microservicios.Atracciones.Catalog/Microservicios.Atracciones.Catalog.API/Dockerfile \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/catalog-api:${{ github.sha }} \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/catalog-api:latest \
            .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/catalog-api:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/catalog-api:latest

  # ============================================================
  # JOB 4: Build & Push - Identify
  # ============================================================
  build-identify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push Identify image
        run: |
          docker build \
            -f Microservicios.Atracciones.Identify/Microservicios.Atracciones.Identify.API/Dockerfile \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/identify-api:${{ github.sha }} \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/identify-api:latest \
            .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/identify-api:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/identify-api:latest

  # ============================================================
  # JOB 4.5: Build & Push - Gateway
  # ============================================================
  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push Gateway image
        run: |
          docker build \
            -f Microservicios.Atracciones.Gateway/Dockerfile \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/gateway-api:${{ github.sha }} \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/gateway-api:latest \
            .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/gateway-api:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/gateway-api:latest

  # ============================================================
  # JOB 5: Deploy all Container Apps
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-billing, build-booking, build-catalog, build-identify, build-gateway]
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Billing to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ca-billing
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/billing-api:${{ github.sha }}
          registryUrl: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Deploy Booking to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ca-booking
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/booking-api:${{ github.sha }}
          registryUrl: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Deploy Catalog to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ca-catalog
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/catalog-api:${{ github.sha }}
          registryUrl: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Deploy Identify to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ca-identify
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/identify-api:${{ github.sha }}
          registryUrl: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Deploy Gateway to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: gateway-api
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/gateway-api:${{ github.sha }}
          registryUrl: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Get deployed URLs
        run: |
          echo "=== URLs de los Microservicios Desplegados ==="
          echo "Billing:  $(az containerapp show -n ca-billing  -g ${{ secrets.AZURE_RESOURCE_GROUP }} --query 'properties.configuration.ingress.fqdn' -o tsv)"
          echo "Booking:  $(az containerapp show -n ca-booking  -g ${{ secrets.AZURE_RESOURCE_GROUP }} --query 'properties.configuration.ingress.fqdn' -o tsv)"
          echo "Catalog:  $(az containerapp show -n ca-catalog  -g ${{ secrets.AZURE_RESOURCE_GROUP }} --query 'properties.configuration.ingress.fqdn' -o tsv)"
          echo "Identify: $(az containerapp show -n ca-identify -g ${{ secrets.AZURE_RESOURCE_GROUP }} --query 'properties.configuration.ingress.fqdn' -o tsv)"
          echo "Gateway:  $(az containerapp show -n gateway-api  -g ${{ secrets.AZURE_RESOURCE_GROUP }} --query 'properties.configuration.ingress.fqdn' -o tsv)"
